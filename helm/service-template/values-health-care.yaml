image:
  repository: defendersd/defender.health-care
  tag: sha-1d37718
  pullPolicy: Always
deploymentStrategy:
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
resources:
  requests:
    cpu: "0m"
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: argo-health-care
      paths:
        - path: /
          pathType: Prefix
autoscaling:
  # Portal calls health-care directly over cluster DNS.
  minReplicaCount: 1
  http:
    enabled: true
