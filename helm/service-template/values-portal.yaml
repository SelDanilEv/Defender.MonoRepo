image:
  repository: defendersd/defender.portal
  tag: 20260806-301_1.4.0
  pullPolicy: Always
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
resources:
  requests:
    cpu: "20m"
extraSecretEnv:
  Telegram__BotToken: Telegram__BotToken
  Telegram__WebhookSecret: Telegram__WebhookSecret
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: argo-portal
      paths:
        - path: /
          pathType: Prefix
    - host: portal.coded-by-danil.dev
      paths:
        - path: /
          pathType: Prefix
    - host: defender-portal.coded-by-danil.dev
      paths:
        - path: /
          pathType: Prefix
autoscaling:
  http:
    enabled: true
