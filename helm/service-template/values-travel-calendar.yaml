image:
  repository: defendersd/defender.travel-calendar
  tag: 20260729-275
  pullPolicy: Always
deploymentStrategy:
  # The single-node cluster cannot schedule the old and replacement pods together.
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1
resources:
  # Keep the request schedulable while retaining the shared service limit.
  requests:
    cpu: "5m"
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - host: argo-travel-calendar
      paths:
        - path: /
          pathType: Prefix
autoscaling:
  # Portal calls travel-calendar directly over cluster DNS.
  minReplicaCount: 1
  http:
    enabled: true
